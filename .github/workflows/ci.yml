name: CI Pipeline
on:
  push:
    branches: ["dev"]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t intranet-newdeal:dev .

  security-scan:
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Scan for vulnerabilities
        run: docker scan intranet-newdeal:dev

  push-docker-hub:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push intranet-newdeal:dev